
spring:
  datasource:
    url: jdbc:h2:mem:stateless-security
    username: sa
    password:
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
    show-sql: true
  h2:
    console:
      enabled: false
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    http-statuses:
      org.springframework.security.authorization.AuthorizationDeniedException: unauthorized
    codes:
      UsersUsernameUnique: USERS_USERNAME_UNIQUE
      RoleNameUnique: ROLE_NAME_UNIQUE
      RoleDescriptionUnique: ROLE_DESCRIPTION_UNIQUE
      PrivilegeNameUnique: PRIVILEGE_NAME_UNIQUE
      UrlsEndpointUnique: URLS_ENDPOINT_UNIQUE
management:
  endpoints:
    web:
      exposure:
        include: health,caches,sessions
  endpoint:
    health:
      show-details: always
springdoc:
  pathsToMatch: /api/**, /authenticate, /register
app:
  baseHost: http://localhost:8800
  google:
    client-id: GET_YOUR_GOOGLE_CLIENT_ID
    client-secret: GET_YOUR_GOOGLE_CLIENT_SECRET
server:
  port: 8800
